<div class="dialog-container">
  <h2 mat-dialog-title>Sub Estados</h2>
  
  <div mat-dialog-content>
    @if (loading) {
      <div class="loading-spinner">
        Cargando subestados...
      </div>
    } @else {
      <div class="table-container">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
          <!-- Columna Código -->
          <ng-container matColumnDef="codigo">
            <th mat-header-cell *matHeaderCellDef> Código </th>
            <td mat-cell *matCellDef="let subEstado"> {{ subEstado.codigo }} </td>
          </ng-container>

          <!-- Columna Tipo de Estado -->
          <ng-container matColumnDef="tipo_estado">
            <th mat-header-cell *matHeaderCellDef> Tipo de Estado </th>
            <td mat-cell *matCellDef="let subEstado"> {{ subEstado.tipo_estado }} </td>
          </ng-container>

          <!-- Columna Acciones -->
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let subEstado">
              <i class="bi bi-trash icon-action" 
                 (click)="eliminarSubEstado(subEstado.id)"
                 title="Eliminar subestado"></i>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        @if (dataSource.length === 0) {
          <div class="no-results">
            No se encontraron subestados para este estado.
          </div>
        }
      </div>
    }
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button (click)="dialogRef.close()">Cerrar</button>
  </div>
</div>
